name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LexTV.apk
      - name: Read version from gradle
        id: ver
        run: |
          VC=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "vc=$VC" >> $GITHUB_OUTPUT
          echo "vn=$VN" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexTV-apk
          path: LexTV.apk
      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.vn }}-${{ steps.ver.outputs.vc }}
          name: LexTV ${{ steps.ver.outputs.vn }}
          body: |
            LexTV 6.5 后台恢复修复 · 特效极速回归 · 记忆裂隙重做

            - 修复"挂后台后回来整个应用点不动,必须强退"的严重问题：原生层
              现在正确转发挂起/恢复给 WebView,并在恢复时唤醒游戏与音频
            - 焦点飞行特效回归"极速版"：光轨/撞击视觉保留,飞行 80~120ms
              (连按 60ms)、粒子减量,按键响应保持即时
            - 记忆裂隙重做：三道符文门全程可开(回声改为加分项,集齐 +60 分
              +1 护盾,不再"吃不完就无法开门");词灵出生在离你最远的角落、
              起步慢 2~3 秒、速度全面放缓;门前提示直白告诉你怎么做
            - 词汇世界流畅模式画质修复：降级不再猛砍分辨率(下限 0.72 倍),
              完整版基准提到 0.9,画面明显更清晰
            - 词境疾驰/星火遗迹保持释义常驻的新玩法
          files: LexTV.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
