name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LexTV.apk
      - name: Read version from gradle
        id: ver
        run: |
          VC=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "vc=$VC" >> $GITHUB_OUTPUT
          echo "vn=$VN" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexTV-apk
          path: LexTV.apk
      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.vn }}-${{ steps.ver.outputs.vc }}
          name: LexTV ${{ steps.ver.outputs.vn }}
          body: |
            LexTV 7.2 迷宫双游"好玩包":冻结水晶 · 逼近警报 · 词灵暴走

            - 记忆裂隙与星火遗迹各新增「冻结水晶」:每房一枚,踩到冻结
              词灵/词怪 3 秒(冻结时变成冰蓝色),是反杀逃生的关键道具
            - 逼近警报:词灵靠近 3 格内,全屏泛起红色脉动 + 低频心跳音,
              紧张感拉满
            - 暴走机制:同一房间拖过 22 秒词灵提速,40 秒彻底暴走 ——
              逼你果断行动,不能磨蹭
            - 训练词源/难度选择等 7.1 功能不变
          files: LexTV.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
