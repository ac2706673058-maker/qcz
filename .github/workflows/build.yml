name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LexTV.apk
      - name: Read version from gradle
        id: ver
        run: |
          VC=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "vc=$VC" >> $GITHUB_OUTPUT
          echo "vn=$VN" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexTV-apk
          path: LexTV.apk
      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.vn }}-${{ steps.ver.outputs.vc }}
          name: LexTV ${{ steps.ver.outputs.vn }}
          body: |
            LexTV 6.7 跑酷换道手感修复

            - 修复词境疾驰"一按横跨两格、边道回不到中间"：原版左右键是
              "跳到最左/最右道"的绝对跳转,现改为一按一格的相对移动,
              边界停住,下键仍可快捷回中道
            - 方向键节流 380ms→120ms,连按不再被吞;跳跃保留 380ms 防双跳

            ── 以下为 6.6 内容 ──

            - 记忆裂隙根治"怎么走都被抓"：迷宫从树状(仅一条路)改为带环路,
              可以绕圈甩开词灵;词灵不再全程完美追踪(近身才穷追,远处游荡);
              入口与三道门旁一格是安全区;被撞不再拖回起点,词灵震退回巢
              冻结 2.6 秒;走错门原地继续,不清进度
            - 词境疾驰新增滚动天空式航段花样：热身/双重路障/回声链(连吃3枚)/
              游走路障(会变道,锁定前可预判)/疾速冲刺(分数×1.5),逐关提速
            - 每个航段开跑时明确报出类型与要点
          files: LexTV.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
