name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LexTV.apk
      - name: Read version from gradle
        id: ver
        run: |
          VC=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "vc=$VC" >> $GITHUB_OUTPUT
          echo "vn=$VN" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexTV-apk
          path: LexTV.apk
      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.vn }}-${{ steps.ver.outputs.vc }}
          name: LexTV ${{ steps.ver.outputs.vn }}
          body: |
            LexTV 8.2 深色主题(默认)· 焦点框错位根治

            - 全新深色主题并设为默认:暖黑底(#1F1E1D)+ 暖白文字 + 暖珊瑚
              强调色,圆润卡片、克制阴影,长时间看电视不再刺眼
            - 设置里「界面主题」可三档切换:深色(默认)/ 暖白 / 护眼暖灰
            - 深色下全部界面重新配色:卡片、焦点、开关、对错反馈、弹层、
              Toast、进度条、3D 世界与游戏场景亮度都已适配
            - 根治"刚进菜单时选择框上下偏、动一下才归位":真凶是列表滚动与
              字体加载发生在测量之后,现在进屏多次校准 + 监听滚动/字体加载,
              四个列表页实测偏差 0 像素
          files: LexTV.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
