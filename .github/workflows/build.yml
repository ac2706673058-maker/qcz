name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LexTV.apk
      - name: Read version from gradle
        id: ver
        run: |
          VC=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "vc=$VC" >> $GITHUB_OUTPUT
          echo "vn=$VN" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexTV-apk
          path: LexTV.apk
      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.vn }}-${{ steps.ver.outputs.vc }}
          name: LexTV ${{ steps.ver.outputs.vn }}
          body: |
            LexTV 6.8 词灵复苏 + 六境疾驰

            - 修复记忆裂隙词灵被符文门安全区卡住、开局不移动的问题；
              保留追逐/游荡规则，并加入低开销漂浮、拖尾、眨眼与视线动画
            - 放大电视端目标词、音标、中文释义和三组符文；右侧符文对照
              与地图使用相同颜色、圆环和字形，选错门后仍保留完整对照
            - 词境疾驰扩展为 6 个连续关卡、12 个词：翡翠天穹、珊瑚云海、
              冰晶峡谷、紫电脉冲、熔岩星桥、霓虹终局
            - 每关拥有独立背景、道路、玩家、词怪、星门配色和航段编排；
              仅复用并重着色现有低面数材质，不增加纹理与绘制批次
            - 保留 6.7 的一按一格相对换道、120ms 方向键响应和下键回中道
          files: LexTV.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
