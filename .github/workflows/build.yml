name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LexTV.apk
      - name: Read version from gradle
        id: ver
        run: |
          VC=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "vc=$VC" >> $GITHUB_OUTPUT
          echo "vn=$VN" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexTV-apk
          path: LexTV.apk
      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.vn }}-${{ steps.ver.outputs.vc }}
          name: LexTV ${{ steps.ver.outputs.vn }}
          body: |
            LexTV 8.1 口语跟读评分

            - 训练馆新增「口语跟读」:电视先示范朗读,你对着遥控器跟读,
              云端识别后与原文比对打分(0~100 分 + 三星评级),
              并显示"电视听到了什么",看得见自己的发音问题
            - 单词与例句交替出现;达标(65 分以上)计入记忆算法
            - 一组 8 题,结束给出平均分与达标数;平均 85 分以上放礼花
            - 上键随时重听示范,下键跳过,全程遥控器可完成

            ── 8.0 ──
            - 全新「家庭对战」:两人同屏轮流答题,答对出招削对方血量,
              胜负记入常驻家庭战绩榜
            - 今日任务全部完成时全屏彩纸礼花庆祝
          files: LexTV.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
