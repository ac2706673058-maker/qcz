name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LexTV.apk
      - name: Read version from gradle
        id: ver
        run: |
          VC=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "vc=$VC" >> $GITHUB_OUTPUT
          echo "vn=$VN" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexTV-apk
          path: LexTV.apk
      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.vn }}-${{ steps.ver.outputs.vc }}
          name: LexTV ${{ steps.ver.outputs.vn }}
          body: "v3.5.1 例句填空升级:四个选项只显示英文单词,题干整句给出中文翻译,靠读懂句子选词;新增「美股交易进阶」词库42词(内置整句译文);其余词库整句翻译AI按需生成并永久缓存。含v3.5实景模拟(盈透/汇丰/DBS 6门App动画实操课)。"
          files: LexTV.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
