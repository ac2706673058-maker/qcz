name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LexTV.apk
      - name: Read version from gradle
        id: ver
        run: |
          VC=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "vc=$VC" >> $GITHUB_OUTPUT
          echo "vn=$VN" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexTV-apk
          path: LexTV.apk
      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.vn }}-${{ steps.ver.outputs.vc }}
          name: LexTV ${{ steps.ver.outputs.vn }}
          body: |
            LexTV 6.4 遥控即时响应与游戏玩法重做

            - 修复主界面焦点动效卡顿：移除"飞行焦点框+撞击粒子"系统(每次按键
              创建十几个动画元素导致停顿和错位)，改为按下即亮的即时焦点
            - 词境疾驰(跑酷)重做：三扇星门的释义全程可见、看着换道即可，
              不再要求 1.6 秒记住符文映射；前两关无路障、路障预留 2 秒反应
            - 记忆裂隙：符文→释义对照表常驻显示，潜入迷宫时不再靠背
            - 星火遗迹：传送门门牌释义常驻显示，玩法一目了然
            - 三个新游戏开场均加入一句话玩法说明
            - 保留词汇世界、家庭空间、云端词书、原生整句发音、自动更新与全部词库
          files: LexTV.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
