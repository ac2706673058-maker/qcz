name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LexTV.apk
      - name: Read version from gradle
        id: ver
        run: |
          VC=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "vc=$VC" >> $GITHUB_OUTPUT
          echo "vn=$VN" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexTV-apk
          path: LexTV.apk
      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.vn }}-${{ steps.ver.outputs.vc }}
          name: LexTV ${{ steps.ver.outputs.vn }}
          body: |
            LexTV 6.9 裂隙压迫回归 · 六大关卡世界

            - 词灵恢复此前的压迫感:近身(≤4格)95% 穷追、远处 75%,速度与
              起步缓冲回到原版水平;出生点避开门区且必有出路,不再消失
            - 记忆裂隙右侧面板大字化:目标单词更大,门的释义配彩色符文
              圆环,与地图上的门一一对应,一目了然
            - 词境疾驰六大主题关卡:翡翠天穹→珊瑚云海→冰晶峡谷→紫电脉冲→
              熔岩星桥→霓虹终局,每关独立航段编排与主题色,终局三重路障
            - 保留一按一格换道、后台恢复修复与全部词库/发音/双用户
          files: LexTV.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
