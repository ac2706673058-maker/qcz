name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LexTV.apk
      - name: Read version from gradle
        id: ver
        run: |
          VC=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "vc=$VC" >> $GITHUB_OUTPUT
          echo "vn=$VN" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexTV-apk
          path: LexTV.apk
      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.vn }}-${{ steps.ver.outputs.vc }}
          name: LexTV ${{ steps.ver.outputs.vn }}
          body: |
            LexTV 8.3 护眼三件套 · 词汇世界夜间皮肤

            - 对全部 14 个界面做了"刺眼审计",找出唯一漏网的大面积高亮:
              词汇世界。现在深色下它变成月夜场景(暗蓝夜空 + 压暗的村庄),
              不再是满屏白天亮景
            - 设置新增「屏幕亮度」4 档(标准/柔和/更暗/极暗夜间):整体调暗
              画面,连 3D 场景和游戏一起生效,用合成层实现不吃性能
            - 设置新增「暖光护眼」3 档:叠加暖色降低蓝光,长时间观看更舒服
            - 设置新增「久看提醒」:连续学习 30 分钟提醒起来放松眼睛
          files: LexTV.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
