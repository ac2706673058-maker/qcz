name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LexTV.apk
      - name: Read version from gradle
        id: ver
        run: |
          VC=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "vc=$VC" >> $GITHUB_OUTPUT
          echo "vn=$VN" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexTV-apk
          path: LexTV.apk
      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.vn }}-${{ steps.ver.outputs.vc }}
          name: LexTV ${{ steps.ver.outputs.vn }}
          body: "v3.6 双使用者+全新发音引擎:主页可一键切换 爸爸金融版⇄弟弟中考版,进度完全独立;发音彻底重做——整句一次合成+原生播放+本地缓存,根治句子漏读;新增拼写挑战(遥控器拼单词);中考词库框架就绪。"
          files: LexTV.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
