name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LexTV.apk
      - name: Read version from gradle
        id: ver
        run: |
          VC=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "vc=$VC" >> $GITHUB_OUTPUT
          echo "vn=$VN" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexTV-apk
          path: LexTV.apk
      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.vn }}-${{ steps.ver.outputs.vc }}
          name: LexTV ${{ steps.ver.outputs.vn }}
          body: |
            LexTV 6.3 词汇世界与记忆裂隙

            - 新增低功耗 3D「词汇世界」，把学习、复习和游戏入口组织成可探索地图
            - 新增「记忆裂隙」实时迷宫潜入：回声碎片、追猎者、符文门与分叉风险路线
            - 新增「词境疾驰」与「星火遗迹」，词义决策融入移动和追逐，不再只是答题卡
            - 优化遥控器输入、防连发、焦点反馈和快速退出重进，降低黑屏与后台占用风险
            - 游戏首次接触正确进入 FSRS 学习记录；隐藏提前泄露的正确答案提示
            - 弟弟空间固定使用中考词库，爸爸及新增用户继续保持独立词书与进度
            - 保留原生整句发音、自动更新、学习游戏、例句训练与双用户数据兼容
          files: LexTV.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
