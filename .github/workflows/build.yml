name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LexTV.apk
      - name: Read version from gradle
        id: ver
        run: |
          VC=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "vc=$VC" >> $GITHUB_OUTPUT
          echo "vn=$VN" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexTV-apk
          path: LexTV.apk
      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.vn }}-${{ steps.ver.outputs.vc }}
          name: LexTV ${{ steps.ver.outputs.vn }}
          body: |
            LexTV 6.2 家庭空间与液态彗星焦点

            - 彻底移除多卡片余波抖动，重做为单一共享焦点框、方向光轨与落点冲击环
            - 护眼模式补齐暖绿焦点光效与低饱和图标，减少大屏蓝光和高亮刺激
            - 新增可扩展家庭空间：新增使用者、独立 FSRS/成绩/设置、安全归档与恢复
            - 新增官方云端词书：电视搜索、SHA-256 校验安装、离线缓存、更新与卸载
            - 词块拼装和句子拼图支持中途即时判错；句子选项统一小写并移除标点泄题
            - 拼写/拼图完成后展示完整中英回顾、重新朗读，并等待用户按 OK 才进入下一题
            - OK 长按采用静默间隔保护，遥控器连发也不会串题或重复记录错误
            - 首页退出前强制保存，原生端移除后台任务并结束进程，下次从干净状态启动
            - 保留 FSRS、2256 词中考/高考库、整句发音、11 种训练游戏、词怪追逐与自动更新
          files: LexTV.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
