name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LexTV.apk
      - name: Read version from gradle
        id: ver
        run: |
          VC=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "vc=$VC" >> $GITHUB_OUTPUT
          echo "vn=$VN" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexTV-apk
          path: LexTV.apk
      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.vn }}-${{ steps.ver.outputs.vc }}
          name: LexTV ${{ steps.ver.outputs.vn }}
          body: "v3.9 界面焕新为 Apple Light 高级白主题(纯白卡片/系统蓝高亮/柔和分层阴影),更像 iOS 系统;「词怪追逐」大改:修正朝向(小人朝右逃、词怪左后方紧追并越逼越大)、视差草原奔跑、答对冲击波+粒子炸退怪物、答错扑抓+震动+红光危险反馈,真正紧张好玩。含导航音效、中考/高考2256词库、双使用者、原生发音。"
          files: LexTV.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
